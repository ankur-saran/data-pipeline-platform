# Spark Log4j2 — structured JSON to stdout
rootLogger.level = WARN
rootLogger.appenderRef.console.ref = Console

appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = JsonTemplateLayout
appender.console.layout.eventTemplateUri = classpath:EcsLayout.json

# Suppress noisy Spark internals
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = WARN
logger.parquet.name = org.apache.parquet
logger.parquet.level = ERROR

# Pipeline application — DEBUG in dev, INFO in prod
logger.pipeline.name = com.pipeline
logger.pipeline.level = INFO
