# =============================================================================
# config/dev/application.conf — Development environment overrides
# Inherits all defaults from resources/application.conf (on classpath)
# =============================================================================

include "application"

pipeline {
  env = "dev"

  spark {
    master             = "local[*]"
    shuffle.partitions = 4          # Low for fast local iterations
    executor.memory    = "1g"
    driver.memory      = "512m"
  }

  paths {
    landing = "/data/landing"
    bronze  = "/data/bronze"
    silver  = "/data/silver"
    gold    = "/data/gold"
    metrics = "/data/metrics"
  }

  quality {
    audit_path             = "/data/quality_audit"
    max_null_rate_bronze   = 0.0
    max_null_rate_silver   = 0.05
    max_null_rate_gold     = 0.0
    min_row_count_silver   = 1
    min_row_count_gold     = 1
  }
}
