# =============================================================================
# config/prod/application.conf — Production environment overrides
# ALL sensitive values must be provided via environment variables.
# =============================================================================

include "application"

pipeline {
  env = "prod"

  spark {
    master             = ${?SPARK_MASTER_URL}
    shuffle.partitions = 200
    executor.memory    = ${?SPARK_EXECUTOR_MEMORY}
    driver.memory      = ${?SPARK_DRIVER_MEMORY}
    executor.cores     = ${?SPARK_EXECUTOR_CORES}
    dynamic.allocation = true
  }

  paths {
    landing = ${?INGESTION_LANDING_PATH}
    bronze  = ${?BRONZE_BASE_PATH}
    silver  = ${?SILVER_BASE_PATH}
    gold    = ${?GOLD_BASE_PATH}
    metrics = ${GOLD_BASE_PATH}"/metrics"
  }

  quality {
    audit_path           = ${GOLD_BASE_PATH}"/quality_audit"
    max_null_rate_bronze = 0.0
    max_null_rate_silver = 0.01
    max_null_rate_gold   = 0.0
    min_row_count_silver = 1000
    min_row_count_gold   = 10
  }

  alerts {
    email    = ${?ALERT_EMAIL}
    on_failure = true
  }
}
