# =============================================================================
# application.conf — Base defaults (classpath resource)
# Env-specific files override these via ConfigLoader.load(env)
# =============================================================================

pipeline {
  env = "dev"

  spark {
    master             = "local[*]"
    shuffle.partitions = 200
    executor.memory    = "2g"
    driver.memory      = "1g"
    executor.cores     = 2
    dynamic.allocation = false
  }

  paths {
    landing = "/data/landing"
    bronze  = "/data/bronze"
    silver  = "/data/silver"
    gold    = "/data/gold"
    metrics = "/data/metrics"
  }

  quality {
    audit_path           = "/data/quality_audit"
    max_null_rate_bronze = 0.0
    max_null_rate_silver = 0.05
    max_null_rate_gold   = 0.0
    min_row_count_silver = 1
    min_row_count_gold   = 1
  }

  alerts {
    email      = "data-eng@company.com"
    on_failure = false
  }
}
